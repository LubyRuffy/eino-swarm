# service configuration
# Sections may repeat keys; each section's value applies only to that section.

[server]
listen = 0.0.0.0
port = 7310
max_entries = 2048
read_timeout_ms = 1500

[cache]
backend = memory
ttl_seconds = 600
max_entries = 4096
eviction = lru

[queue]
backend = disk
max_entries = 16384
flush_interval_ms = 250

[logging]
level = info
format = json
